<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="100%" role="img" aria-labelledby="figt figd" font-family="Georgia,'Times New Roman',serif">
<title id="figt">Proof architecture and the reduced set of possible passage times</title>
<desc id="figd">Panel a: a real shortcut-Collatz orbit descends inside the certified high-rank envelope of slope a0 minus 1; at each high threshold it makes a first passage into a landing band and is certified until the switch, below which the low rule either crosses within the parent rank or records a timeout. Panel b: a schematic order comparison records the reduction from all times in a linear horizon to O(sqrt(M log M)) possible passage times. The bar lengths do not represent theorem constants.</desc>
